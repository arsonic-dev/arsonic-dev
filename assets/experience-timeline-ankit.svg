<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="exp-title exp-desc">
  <title id="exp-title">Experience — Ankit Kumar</title>
  <desc id="exp-desc">Freelance Full-Stack &amp; AI Engineer, IISER Berhampur AI Web Dev Intern, NIST University Computer Vision Intern.</desc>
  <defs>
    <linearGradient id="exp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1F17"/>
      <stop offset="1" stop-color="#060E0A"/>
    </linearGradient>
    <radialGradient id="exp-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#1A6B4A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#060E0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="exp-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B5E5CB"/>
      <stop offset=".5" stop-color="#7BC7A4"/>
      <stop offset="1" stop-color="#1A6B4A" stop-opacity=".2"/>
    </linearGradient>
    
    <!-- Laser trace gradients for continuous border animations -->
    <linearGradient id="exp-trace-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F8F3"/>
      <stop offset=".4" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#1A6B4A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="exp-trace-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5E5CB"/>
      <stop offset=".4" stop-color="#7BC7A4"/>
      <stop offset="1" stop-color="#1A6B4A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="exp-trace-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BC7A4"/>
      <stop offset=".4" stop-color="#1A6B4A"/>
      <stop offset="1" stop-color="#060E0A" stop-opacity="0"/>
    </linearGradient>

    <!-- Fiber rail gradient -->
    <linearGradient id="exp-rail-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A6B4A" stop-opacity="0"/>
      <stop offset=".2" stop-color="#7BC7A4" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#B5E5CB" stop-opacity=".6"/>
      <stop offset=".8" stop-color="#7BC7A4" stop-opacity=".4"/>
      <stop offset="1" stop-color="#1A6B4A" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="exp-pulse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="exp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7BC7A4" stroke-opacity=".05"/>
    </pattern>

    <filter id="exp-glow-f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .exp-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .exp-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .exp-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    
    .exp-card { animation: exp-fade 1.1s cubic-bezier(.16,1,.3,1) both; }
    .exp-c1 { animation-delay: .1s; } .exp-c2 { animation-delay: .3s; } .exp-c3 { animation-delay: .5s; }
    @keyframes exp-fade { from { opacity: 0; } to { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { 
      .exp-card { animation: none; } 
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="480" rx="18" fill="url(#exp-bg)"/>
  <rect width="1200" height="480" fill="url(#exp-grid)" rx="18"/>
  
  <!-- Continuous Ambient Light Sway -->
  <ellipse cx="600" cy="120" rx="460" ry="240" fill="url(#exp-glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 40 25; 0 0" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
  </ellipse>
  <rect x=".5" y=".5" width="1199" height="479" rx="17.5" fill="none" stroke="#7BC7A4" stroke-opacity=".18"/>

  <!-- Horizontal Data Interconnect Rail -->
  <path d="M 48 240 H 1152" stroke="url(#exp-rail-grad)" stroke-width="1.2" stroke-dasharray="4 8"/>
  
  <!-- Connector Bridges between cards -->
  <line x1="392" y1="240" x2="428" y2="240" stroke="#7BC7A4" stroke-width="2" stroke-dasharray="2 4">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="772" y1="240" x2="808" y2="240" stroke="#7BC7A4" stroke-width="2" stroke-dasharray="2 4">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Traveling Photon Packet across the timeline rail -->
  <circle cx="48" cy="240" r="4.5" fill="url(#exp-pulse-glow)" filter="url(#exp-glow-f)">
    <animate attributeName="cx" values="48;1152;48" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Ambient Particles -->
  <g fill="#B5E5CB">
    <circle cx="210" cy="450" r="1.3">
      <animate attributeName="cy" values="450;390" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="460" r="1.5">
      <animate attributeName="cy" values="460;400" dur="5.2s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="5.2s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="455" r="1.2">
      <animate attributeName="cy" values="455;395" dur="7.2s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="7.2s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= CARD 1: FREELANCE (ACTIVE) ================= -->
  <g transform="translate(48, 36)">
    <g class="exp-card exp-c1">
      <!-- Base Card Body -->
      <rect width="344" height="408" rx="14" fill="#0C241B" fill-opacity=".75" stroke="#7BC7A4" stroke-opacity=".25"/>
      
      <!-- Top accent bar with pulse -->
      <rect x="0" y="0" width="344" height="3" rx="1.5" fill="#7BC7A4">
        <animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/>
      </rect>

      <!-- Continuous Laser Border Trace -->
      <rect width="344" height="408" rx="14" fill="none" stroke="url(#exp-trace-1)" stroke-width="1.8" stroke-dasharray="180 1300" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="1480;0" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Meta tag pill with LIVE Beacon -->
      <rect x="20" y="24" width="156" height="22" rx="11" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
      
      <!-- Live pulsing radar dot -->
      <circle cx="33" cy="35" r="3.5" fill="#10B981">
        <animate attributeName="r" values="2.5;4.2;2.5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="33" cy="35" r="6" fill="none" stroke="#7BC7A4" stroke-opacity=".8">
        <animate attributeName="r" values="3.5;7.5;3.5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text class="exp-mono" x="98" y="39" text-anchor="middle" font-size="10.5" fill="#B5E5CB" letter-spacing="1">NOV 2025 – PRESENT</text>

      <text class="exp-serif" x="20" y="80" font-size="24" font-weight="300" fill="#F0F8F3">Freelance</text>
      <text class="exp-mono" x="20" y="104" font-size="12" fill="#7BC7A4">Full-Stack &amp; AI Engineer</text>
      <text class="exp-sans" x="20" y="124" font-size="12" fill="#8FA99A">Remote — India · Self-Employed</text>

      <line x1="20" y1="142" x2="324" y2="142" stroke="#7BC7A4" stroke-opacity=".2"/>

      <!-- Highlight 1 -->
      <g transform="translate(20, 164)">
        <circle cx="4" cy="6" r="3" fill="#7BC7A4">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text class="exp-sans" x="16" y="10" font-size="12.5" fill="#F0F8F3" font-weight="500">5 Medical Businesses</text>
        <text class="exp-sans" x="16" y="28" font-size="11.5" fill="#8FA99A">Built end-to-end ERP (billing, inventory,</text>
        <text class="exp-sans" x="16" y="44" font-size="11.5" fill="#8FA99A">appointments &amp; reports) with React,</text>
        <text class="exp-sans" x="16" y="60" font-size="11.5" fill="#8FA99A">Fastify, PostgreSQL &amp; TypeScript.</text>
      </g>

      <!-- Highlight 2 -->
      <g transform="translate(20, 246)">
        <circle cx="4" cy="6" r="3" fill="#7BC7A4">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <text class="exp-sans" x="16" y="10" font-size="12.5" fill="#F0F8F3" font-weight="500">15+ Client Platforms</text>
        <text class="exp-sans" x="16" y="28" font-size="11.5" fill="#8FA99A">Engineered customized websites &amp;</text>
        <text class="exp-sans" x="16" y="44" font-size="11.5" fill="#8FA99A">production RAG AI chatbots enabling</text>
        <text class="exp-sans" x="16" y="60" font-size="11.5" fill="#8FA99A">natural language business intelligence.</text>
      </g>

      <!-- Stack chips -->
      <g transform="translate(20, 344)">
        <rect x="0" y="0" width="76" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="38" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">React / TS</text>
        <rect x="84" y="0" width="60" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="114" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">Fastify</text>
        <rect x="152" y="0" width="68" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="186" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">Postgres</text>
        <rect x="228" y="0" width="76" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="266" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">RAG / LLM</text>
      </g>
    </g>
  </g>

  <!-- ================= CARD 2: IISER BERHAMPUR ================= -->
  <g transform="translate(428, 36)">
    <g class="exp-card exp-c2">
      <!-- Base Card Body -->
      <rect width="344" height="408" rx="14" fill="#0C241B" fill-opacity=".75" stroke="#7BC7A4" stroke-opacity=".25"/>
      
      <!-- Top accent bar -->
      <rect x="0" y="0" width="344" height="3" rx="1.5" fill="#1A6B4A">
        <animate attributeName="opacity" values=".6;1;.6" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>

      <!-- Continuous Laser Border Trace -->
      <rect width="344" height="408" rx="14" fill="none" stroke="url(#exp-trace-2)" stroke-width="1.8" stroke-dasharray="180 1300" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="1480;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Meta tag pill -->
      <rect x="20" y="24" width="140" height="22" rx="11" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
      <text class="exp-mono" x="90" y="39" text-anchor="middle" font-size="10.5" fill="#B5E5CB" letter-spacing="1">MAY 2025 – JUL 2025</text>

      <text class="exp-serif" x="20" y="80" font-size="24" font-weight="300" fill="#F0F8F3">IISER Berhampur</text>
      <text class="exp-mono" x="20" y="104" font-size="12" fill="#7BC7A4">AI Web Dev Intern</text>
      <text class="exp-sans" x="20" y="124" font-size="12" fill="#8FA99A">Berhampur, Odisha · Research Institute</text>

      <line x1="20" y1="142" x2="324" y2="142" stroke="#7BC7A4" stroke-opacity=".2"/>

      <!-- Highlight 1 -->
      <g transform="translate(20, 164)">
        <circle cx="4" cy="6" r="3" fill="#7BC7A4">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <text class="exp-sans" x="16" y="10" font-size="12.5" fill="#F0F8F3" font-weight="500">20+ Page Subdomain Migration</text>
        <text class="exp-sans" x="16" y="28" font-size="11.5" fill="#8FA99A">Redesigned library portal with React &amp;</text>
        <text class="exp-sans" x="16" y="44" font-size="11.5" fill="#8FA99A">FastAPI; implemented modular components,</text>
        <text class="exp-sans" x="16" y="60" font-size="11.5" fill="#8FA99A">code splitting &amp; aggressive asset caching.</text>
      </g>

      <!-- Highlight 2 -->
      <g transform="translate(20, 246)">
        <circle cx="4" cy="6" r="3" fill="#7BC7A4">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="2s" repeatCount="indefinite"/>
        </circle>
        <text class="exp-sans" x="16" y="10" font-size="12.5" fill="#F0F8F3" font-weight="500">Semantic AI Search Engine</text>
        <text class="exp-sans" x="16" y="28" font-size="11.5" fill="#8FA99A">Built FastAPI vector retrieval endpoints</text>
        <text class="exp-sans" x="16" y="44" font-size="11.5" fill="#8FA99A">with embeddings; tested via PyTest/Jest</text>
        <text class="exp-sans" x="16" y="60" font-size="11.5" fill="#8FA99A">for 0 service disruption and high precision.</text>
      </g>

      <!-- Stack chips -->
      <g transform="translate(20, 344)">
        <rect x="0" y="0" width="65" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="32" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">FastAPI</text>
        <rect x="73" y="0" width="60" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="103" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">React</text>
        <rect x="141" y="0" width="82" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="182" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">Embeddings</text>
        <rect x="231" y="0" width="72" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="267" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">PyTest/Jest</text>
      </g>
    </g>
  </g>

  <!-- ================= CARD 3: NIST UNIVERSITY ================= -->
  <g transform="translate(808, 36)">
    <g class="exp-card exp-c3">
      <!-- Base Card Body -->
      <rect width="344" height="408" rx="14" fill="#0C241B" fill-opacity=".75" stroke="#7BC7A4" stroke-opacity=".25"/>
      
      <!-- Top accent bar -->
      <rect x="0" y="0" width="344" height="3" rx="1.5" fill="#1A6B4A">
        <animate attributeName="opacity" values=".6;1;.6" dur="3s" begin="2s" repeatCount="indefinite"/>
      </rect>

      <!-- Continuous Laser Border Trace -->
      <rect width="344" height="408" rx="14" fill="none" stroke="url(#exp-trace-3)" stroke-width="1.8" stroke-dasharray="180 1300" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="1480;0" dur="6s" begin="4s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Meta tag pill -->
      <rect x="20" y="24" width="140" height="22" rx="11" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
      <text class="exp-mono" x="90" y="39" text-anchor="middle" font-size="10.5" fill="#B5E5CB" letter-spacing="1">JUL 2024 – AUG 2024</text>

      <text class="exp-serif" x="20" y="80" font-size="24" font-weight="300" fill="#F0F8F3">NIST University</text>
      <text class="exp-mono" x="20" y="104" font-size="12" fill="#7BC7A4">Computer Vision Intern</text>
      <text class="exp-sans" x="20" y="124" font-size="12" fill="#8FA99A">Berhampur, Odisha · Edge Hardware Lab</text>

      <line x1="20" y1="142" x2="324" y2="142" stroke="#7BC7A4" stroke-opacity=".2"/>

      <!-- Highlight 1 -->
      <g transform="translate(20, 164)">
        <circle cx="4" cy="6" r="3" fill="#7BC7A4">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <text class="exp-sans" x="16" y="10" font-size="12.5" fill="#F0F8F3" font-weight="500">Real-Time Object Detection</text>
        <text class="exp-sans" x="16" y="28" font-size="11.5" fill="#8FA99A">Implemented edge classification pipeline</text>
        <text class="exp-sans" x="16" y="44" font-size="11.5" fill="#8FA99A">using OpenCV &amp; Python with adaptive</text>
        <text class="exp-sans" x="16" y="60" font-size="11.5" fill="#8FA99A">thresholding and ROI contour cropping.</text>
      </g>

      <!-- Highlight 2 -->
      <g transform="translate(20, 246)">
        <circle cx="4" cy="6" r="3" fill="#7BC7A4">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="2.6s" repeatCount="indefinite"/>
        </circle>
        <text class="exp-sans" x="16" y="10" font-size="12.5" fill="#F0F8F3" font-weight="500">Throughput Optimization (25+ FPS)</text>
        <text class="exp-sans" x="16" y="28" font-size="11.5" fill="#8FA99A">Eliminated memory overflow on edge chip</text>
        <text class="exp-sans" x="16" y="44" font-size="11.5" fill="#8FA99A">using frame skipping, grayscale prep,</text>
        <text class="exp-sans" x="16" y="60" font-size="11.5" fill="#8FA99A">and dynamic resolution scaling.</text>
      </g>

      <!-- Stack chips -->
      <g transform="translate(20, 344)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="30" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">OpenCV</text>
        <rect x="68" y="0" width="56" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="96" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">Python</text>
        <rect x="132" y="0" width="80" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <text class="exp-mono" x="172" y="15" text-anchor="middle" font-size="10" fill="#B5E5CB">Edge Compute</text>
        
        <!-- 25+ FPS stream chip with live radar dot -->
        <rect x="220" y="0" width="88" height="22" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".25"/>
        <circle cx="230" cy="11" r="2.5" fill="#10B981">
          <animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <text class="exp-mono" x="268" y="15" text-anchor="middle" font-size="9.5" fill="#B5E5CB">25+ FPS Stream</text>
      </g>
    </g>
  </g>
</svg>
