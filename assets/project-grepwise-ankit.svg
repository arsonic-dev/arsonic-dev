<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="gw-t">
  <title id="gw-t">Grepwise: Codebase RAG with Eval-Gated Retrieval and Tree-sitter chunking.</title>
  <defs>
    <linearGradient id="gw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F17"/>
      <stop offset="1" stop-color="#060E0A"/>
    </linearGradient>
    <radialGradient id="gw-glow" cx="80%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1A6B4A" stop-opacity=".6"/>
      <stop offset="1" stop-color="#060E0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gw-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7BC7A4" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="gw-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <clipPath id="gw-scanner-clip"><rect x="0" y="0" width="352" height="110" rx="8"/></clipPath>

    <!-- Laser trace gradients for continuous border animations -->
    <linearGradient id="gw-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F8F3"/>
      <stop offset=".45" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gw-card-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5E5CB"/>
      <stop offset=".5" stop-color="#7BC7A4"/>
      <stop offset="1" stop-color="#143D2E" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanner beam gradient -->
    <linearGradient id="gw-scan-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BC7A4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B5E5CB" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </linearGradient>

    <!-- Traveling photon gradient -->
    <radialGradient id="gw-photon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </radialGradient>

    <filter id="gw-glow-f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .gw-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .gw-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .gw-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gw-in { animation: gw-fade 1.1s cubic-bezier(.16,1,.3,1) both; }
    .gw-d1 { animation-delay: .1s; } .gw-d2 { animation-delay: .3s; }
    .gw-chip { animation: gw-fade .7s cubic-bezier(.34,1.56,.64,1) both; }
    .gw-draw { stroke-dasharray: 624; stroke-dashoffset: 624; animation: gw-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    @keyframes gw-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes gw-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .gw-in, .gw-chip, .gw-draw { animation: none; stroke-dashoffset: 0; } }
  </style>

  <g clip-path="url(#gw-clip)">
    <!-- Background Canvas -->
    <rect width="1200" height="370" fill="url(#gw-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#gw-grid)"/>
    
    <!-- Continuous Ambient Light Glow -->
    <ellipse cx="960" cy="110" rx="360" ry="190" fill="url(#gw-glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -25 15; 0 0" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#7BC7A4" stroke-opacity=".18"/>

    <!-- Continuous Outer Perimeter Laser Trace -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#gw-trace)" stroke-width="1.8" stroke-dasharray="220 2920" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="3140;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Left side content -->
    <g class="gw-in gw-d1">
      <text class="gw-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#7BC7A4">02 · ADVANCED RAG · EVAL-GATED RETRIEVAL · 2026</text>
      <text class="gw-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F0F8F3">Grepwise</text>
      <text class="gw-sans" x="56" y="154" font-size="16.5" fill="#8FA99A">Codebase RAG with AST semantic chunking, cross-encoder reranking &amp; CI eval harness.</text>
      <text class="gw-mono" x="56" y="188" font-size="12" fill="#B5E5CB"><tspan fill="#7BC7A4">BUILT ›</tspan> Tree-sitter AST parsing + Hybrid BM25 &amp; Dense Search with automated CI regression gates</text>
      
      <!-- Divider line -->
      <line class="gw-draw" x1="56" y1="214" x2="680" y2="214" stroke="#7BC7A4" stroke-opacity=".25"/>
      
      <!-- Traveling Photon Packet across divider -->
      <circle cx="56" cy="214" r="3.5" fill="url(#gw-photon-glow)" filter="url(#gw-glow-f)">
        <animate attributeName="cx" values="56;680;56" dur="6s" begin="1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1; .45 0 .55 1"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="1s" repeatCount="indefinite"/>
      </circle>

      <!-- Metrics -->
      <g transform="translate(56, 252)">
        <text class="gw-serif" font-size="32" font-weight="300" fill="#F0F8F3">AST</text>
        <text class="gw-sans" y="22" font-size="12" fill="#8FA99A">Tree-sitter chunking</text>
      </g>
      <g transform="translate(210, 252)">
        <text class="gw-serif" font-size="32" font-weight="300" fill="#F0F8F3">Hybrid</text>
        <text class="gw-sans" y="22" font-size="12" fill="#8FA99A">BM25 + Cross-Encoder</text>
      </g>
      <g transform="translate(425, 252)">
        <text class="gw-serif" font-size="32" font-weight="300" fill="#F0F8F3">CI-Gated</text>
        <text class="gw-sans" y="22" font-size="12" fill="#8FA99A">Golden-set eval harness</text>
      </g>

      <!-- Tech Stack Badges -->
      <g class="gw-chip" style="animation-delay:0.5s">
        <rect x="56" y="306" width="65" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="gw-mono" x="88" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">FastAPI</text>
      </g>
      <g class="gw-chip" style="animation-delay:0.6s">
        <rect x="129" y="306" width="88" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="gw-mono" x="173" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Tree-sitter</text>
      </g>
      <g class="gw-chip" style="animation-delay:0.7s">
        <rect x="225" y="306" width="88" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="gw-mono" x="269" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">PostgreSQL</text>
      </g>
      <g class="gw-chip" style="animation-delay:0.8s">
        <rect x="321" y="306" width="70" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="gw-mono" x="356" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Next.js</text>
      </g>
      <g class="gw-chip" style="animation-delay:0.9s">
        <rect x="399" y="306" width="66" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="gw-mono" x="432" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Docker</text>
      </g>
      <g class="gw-chip" style="animation-delay:1.0s">
        <rect x="473" y="306" width="130" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="gw-mono" x="538" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Cross-Encoder</text>
      </g>
    </g>

    <!-- Right Side Mockup Frame -->
    <g transform="translate(740, 46)">
      <g class="gw-in gw-d2">
        <!-- Browser / Terminal Frame -->
        <rect width="400" height="278" rx="12" fill="#0C241B" stroke="#7BC7A4" stroke-opacity=".3" stroke-width="1.2"/>
        
        <!-- Continuous Laser Border Trace around Frame -->
        <rect width="400" height="278" rx="12" fill="none" stroke="url(#gw-card-trace)" stroke-width="1.6" stroke-dasharray="140 1216" stroke-linecap="round">
          <animate attributeName="stroke-dashoffset" values="1356;0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
        </rect>

        <!-- Title bar -->
        <rect width="400" height="34" rx="12" fill="#143D2E" fill-opacity=".6"/>
        <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity=".8"/>
        <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity=".8"/>
        <circle cx="52" cy="17" r="4.5" fill="#10B981">
          <animate attributeName="opacity" values="1;.4;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        
        <text class="gw-mono" x="76" y="21" font-size="10.5" fill="#8FA99A">grepwise.ai/trace</text>
        
        <!-- Live Eval Gate Status Pill -->
        <rect x="256" y="8" width="132" height="18" rx="9" fill="#0B1F17" stroke="#7BC7A4" stroke-opacity=".35"/>
        <circle cx="266" cy="17" r="3" fill="#10B981">
          <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <text class="gw-mono" x="326" y="20.5" text-anchor="middle" font-size="8.5" fill="#B5E5CB">EVAL-GATE · PASS</text>

        <!-- RAG Pipeline Trace Box -->
        <g transform="translate(24, 52)">
          <rect width="352" height="110" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          
          <!-- AST Laser Scanner Sweep -->
          <g clip-path="url(#gw-scanner-clip)">
            <line x1="0" y1="0" x2="352" y2="0" stroke="url(#gw-scan-beam)" stroke-width="2">
              <animate attributeName="y1" values="10;105;10" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
              <animate attributeName="y2" values="10;105;10" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
            </line>
          </g>

          <text class="gw-mono" x="14" y="22" font-size="10.5" fill="#7BC7A4">AST CHUNK NODE: class AuthMiddleware</text>
          <text class="gw-mono" x="14" y="42" font-size="9.5" fill="#B5E5CB">› Lines 42-108 [tree-sitter-python]</text>
          <text class="gw-mono" x="14" y="60" font-size="9.5" fill="#8FA99A">› Dense Score: 0.942 | BM25: 18.4 | Cross: 0.988</text>
          
          <!-- Animated flow line -->
          <line x1="14" y1="74" x2="338" y2="74" stroke="#7BC7A4" stroke-opacity=".2" stroke-dasharray="3 3">
            <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
          </line>
          
          <text class="gw-mono" x="14" y="94" font-size="10" fill="#F0F8F3">Citations: <tspan fill="#7BC7A4">auth/service.py#L42-L108</tspan></text>
        </g>

        <!-- Status Cards -->
        <g transform="translate(24, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="gw-mono" x="14" y="22" font-size="10" fill="#8FA99A">RECALL EVAL</text>
          <text class="gw-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">96.4% Recall</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <text class="gw-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">Golden-Set Gate</text>
        </g>
        
        <g transform="translate(206, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="gw-mono" x="14" y="22" font-size="10" fill="#8FA99A">CI STATUS</text>
          <text class="gw-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">GitHub Actions</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" begin=".75s" repeatCount="indefinite"/>
          </circle>
          <text class="gw-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">PR Guard Passing</text>
        </g>
      </g>
    </g>
  </g>
</svg>
