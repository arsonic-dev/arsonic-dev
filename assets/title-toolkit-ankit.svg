<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="04 Toolkit: The tools I reach for.">
  <defs>
    <linearGradient id="ta-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#7BC7A4"/><stop offset=".6" stop-color="#1A6B4A"/><stop offset="1" stop-color="#1A6B4A" stop-opacity="0"/></linearGradient>
    <radialGradient id="ta-pulse"><stop offset="0" stop-color="#F0F8F3"/><stop offset=".5" stop-color="#B5E5CB" stop-opacity=".6"/><stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/></radialGradient>
  </defs>
  <style>.ta-serif{font-family:Georgia,serif}.ta-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ta-in{animation:ta-in 1.1s cubic-bezier(.16,1,.3,1) both}.ta-d2{animation-delay:.2s}.ta-d3{animation-delay:.45s}.ta-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ta-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}@keyframes ta-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes ta-draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.ta-in{animation:none}.ta-draw{animation:none;stroke-dashoffset:0}}</style>
  <g class="ta-in"><text class="ta-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#7BC7A4"><tspan fill="#B5E5CB">04</tspan>   TOOLKIT</text></g>
  <g class="ta-in ta-d2"><text class="ta-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#F0F8F3">The tools I reach for.</text></g>
  <g class="ta-in ta-d3"><text class="ta-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#8FA99A">TECH STACK</text></g>
  <path class="ta-draw" d="M40 106 H1160" stroke="url(#ta-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#ta-pulse)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>
