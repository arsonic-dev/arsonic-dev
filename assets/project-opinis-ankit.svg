<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="op-t">
  <title id="op-t">Opinis: Full-stack sentiment intelligence platform with multi-provider LLMs and WebGL emotion vectors.</title>
  <defs>
    <linearGradient id="op-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F17"/>
      <stop offset="1" stop-color="#060E0A"/>
    </linearGradient>
    <radialGradient id="op-glow" cx="80%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1A6B4A" stop-opacity=".6"/>
      <stop offset="1" stop-color="#060E0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="op-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7BC7A4" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="op-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    
    <!-- Laser trace gradients for continuous border animations -->
    <linearGradient id="op-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F8F3"/>
      <stop offset=".45" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="op-card-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5E5CB"/>
      <stop offset=".5" stop-color="#7BC7A4"/>
      <stop offset="1" stop-color="#143D2E" stop-opacity="0"/>
    </linearGradient>

    <!-- Traveling photon gradient -->
    <radialGradient id="op-photon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </radialGradient>

    <filter id="op-glow-f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .op-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .op-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .op-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .op-in { animation: op-fade 1.1s cubic-bezier(.16,1,.3,1) both; }
    .op-d1 { animation-delay: .1s; } .op-d2 { animation-delay: .3s; }
    .op-chip { animation: op-fade .7s cubic-bezier(.34,1.56,.64,1) both; }
    .op-draw { stroke-dasharray: 624; stroke-dashoffset: 624; animation: op-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    @keyframes op-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes op-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .op-in, .op-chip, .op-draw { animation: none; stroke-dashoffset: 0; } }
  </style>

  <g clip-path="url(#op-clip)">
    <!-- Background Canvas -->
    <rect width="1200" height="370" fill="url(#op-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#op-grid)"/>
    
    <!-- Continuous Ambient Light Glow -->
    <ellipse cx="960" cy="110" rx="360" ry="190" fill="url(#op-glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -25 15; 0 0" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#7BC7A4" stroke-opacity=".18"/>

    <!-- Continuous Outer Perimeter Laser Trace -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#op-trace)" stroke-width="1.8" stroke-dasharray="220 2920" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="3140;0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Left side content -->
    <g class="op-in op-d1">
      <text class="op-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#7BC7A4">01 · FOUNDER PLATFORM · AI &amp; MULTI-LLM · 2026</text>
      <text class="op-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F0F8F3">OPINIS</text>
      <text class="op-sans" x="56" y="154" font-size="16.5" fill="#8FA99A">Sentiment Intelligence Platform with WebGL emotion vectors &amp; live batch analytics.</text>
      <text class="op-mono" x="56" y="188" font-size="12" fill="#B5E5CB"><tspan fill="#7BC7A4">BUILT ›</tspan> Gemini 2.0 Flash + Groq Llama 3.1 pipeline with 4-stage resilient response parsing</text>
      
      <!-- Divider line -->
      <line class="op-draw" x1="56" y1="214" x2="680" y2="214" stroke="#7BC7A4" stroke-opacity=".25"/>
      
      <!-- Traveling Photon Packet across divider -->
      <circle cx="56" cy="214" r="3.5" fill="url(#op-photon-glow)" filter="url(#op-glow-f)">
        <animate attributeName="cx" values="56;680;56" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1; .45 0 .55 1"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- Metrics with subtle pulse -->
      <g transform="translate(56, 252)">
        <text class="op-serif" font-size="32" font-weight="300" fill="#F0F8F3">2 LLM</text>
        <text class="op-sans" y="22" font-size="12" fill="#8FA99A">Gemini 2.0 + Groq parallel</text>
      </g>
      <g transform="translate(240, 252)">
        <text class="op-serif" font-size="32" font-weight="300" fill="#F0F8F3">4-Stage</text>
        <text class="op-sans" y="22" font-size="12" fill="#8FA99A">malformed JSON parser</text>
      </g>
      <g transform="translate(425, 252)">
        <text class="op-serif" font-size="32" font-weight="300" fill="#F0F8F3">8 Suites</text>
        <text class="op-sans" y="22" font-size="12" fill="#8FA99A">Vitest injection &amp; auth tests</text>
      </g>

      <!-- Tech Stack Badges -->
      <g class="op-chip" style="animation-delay:0.5s">
        <rect x="56" y="306" width="70" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="op-mono" x="91" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Next.js</text>
      </g>
      <g class="op-chip" style="animation-delay:0.6s">
        <rect x="134" y="306" width="86" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="op-mono" x="177" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">TypeScript</text>
      </g>
      <g class="op-chip" style="animation-delay:0.7s">
        <rect x="228" y="306" width="88" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="op-mono" x="272" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">PostgreSQL</text>
      </g>
      <g class="op-chip" style="animation-delay:0.8s">
        <rect x="324" y="306" width="56" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="op-mono" x="352" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Redis</text>
      </g>
      <g class="op-chip" style="animation-delay:0.9s">
        <rect x="388" y="306" width="62" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="op-mono" x="419" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">WebGL</text>
      </g>
      <g class="op-chip" style="animation-delay:1.0s">
        <rect x="458" y="306" width="138" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="op-mono" x="527" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Gemini 2.0 + Groq</text>
      </g>
    </g>

    <!-- Right Side Mockup Frame -->
    <g transform="translate(740, 46)">
      <g class="op-in op-d2">
        <!-- Browser / Terminal Frame -->
        <rect width="400" height="278" rx="12" fill="#0C241B" stroke="#7BC7A4" stroke-opacity=".3" stroke-width="1.2"/>
        
        <!-- Continuous Laser Border Trace around Frame -->
        <rect width="400" height="278" rx="12" fill="none" stroke="url(#op-card-trace)" stroke-width="1.6" stroke-dasharray="140 1216" stroke-linecap="round">
          <animate attributeName="stroke-dashoffset" values="1356;0" dur="6s" repeatCount="indefinite"/>
        </rect>

        <!-- Title bar -->
        <rect width="400" height="34" rx="12" fill="#143D2E" fill-opacity=".6"/>
        <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity=".8"/>
        <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity=".8"/>
        <circle cx="52" cy="17" r="4.5" fill="#10B981">
          <animate attributeName="opacity" values="1;.4;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        
        <text class="op-mono" x="76" y="21" font-size="10.5" fill="#8FA99A">opinis.ai/analyze</text>
        
        <!-- Live Stream Status Pill in Browser -->
        <rect x="264" y="8" width="124" height="18" rx="9" fill="#0B1F17" stroke="#7BC7A4" stroke-opacity=".35"/>
        <circle cx="274" cy="17" r="3" fill="#10B981">
          <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <text class="op-mono" x="330" y="20.5" text-anchor="middle" font-size="8.5" fill="#B5E5CB">LIVE · 48 req/s</text>

        <!-- Emotion Vector Canvas Mockup -->
        <g transform="translate(24, 52)">
          <rect width="352" height="110" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          
          <!-- Animated Radar / Oscilloscope Wave lines -->
          <path d="M20 70 Q 70 20, 120 50 T 220 30 T 330 65" fill="none" stroke="#7BC7A4" stroke-width="2" stroke-linecap="round">
            <animate attributeName="d" values="
              M20 70 Q 70 20, 120 50 T 220 30 T 330 65;
              M20 65 Q 70 30, 120 45 T 220 38 T 330 60;
              M20 70 Q 70 20, 120 50 T 220 30 T 330 65"
              dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          </path>
          
          <path d="M20 85 Q 90 40, 160 70 T 260 45 T 330 75" fill="none" stroke="#B5E5CB" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="4 4">
            <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.2s" repeatCount="indefinite"/>
          </path>
          
          <!-- Vector Connecting Beam with moving pulse -->
          <line x1="120" y1="50" x2="220" y2="30" stroke="#7BC7A4" stroke-width="1.2" stroke-opacity=".4" stroke-dasharray="2 3">
            <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
          </line>
          
          <!-- Emotion Node 1: JOY with pulsing radar rings -->
          <circle cx="120" cy="50" r="5" fill="#7BC7A4">
            <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="120" cy="50" r="8" fill="none" stroke="#7BC7A4" stroke-opacity=".6">
            <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".6;0;.6" dur="2s" repeatCount="indefinite"/>
          </circle>
          <text class="op-mono" x="120" y="38" text-anchor="middle" font-size="9" fill="#B5E5CB">JOY +0.89</text>

          <!-- Emotion Node 2: TRUST with pulsing radar rings -->
          <circle cx="220" cy="30" r="5" fill="#B5E5CB">
            <animate attributeName="r" values="4;5.5;4" dur="2s" begin="1s" repeatCount="indefinite"/>
          </circle>
          <circle cx="220" cy="30" r="8" fill="none" stroke="#B5E5CB" stroke-opacity=".6">
            <animate attributeName="r" values="5;11;5" dur="2s" begin="1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".6;0;.6" dur="2s" begin="1s" repeatCount="indefinite"/>
          </circle>
          <text class="op-mono" x="220" y="18" text-anchor="middle" font-size="9" fill="#F0F8F3">TRUST +0.94</text>
          
          <text class="op-mono" x="30" y="100" font-size="10" fill="#7BC7A4">WebGL Emotion Vector Engine · Realtime</text>
        </g>

        <!-- Status Cards -->
        <g transform="translate(24, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="op-mono" x="14" y="22" font-size="10" fill="#8FA99A">LLM PIPELINE</text>
          <text class="op-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">Groq Llama 3.1</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <text class="op-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">Cached (SHA-256)</text>
        </g>
        
        <g transform="translate(206, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="op-mono" x="14" y="22" font-size="10" fill="#8FA99A">SECURITY LAYER</text>
          <text class="op-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">Zod + Clerk Auth</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" begin=".75s" repeatCount="indefinite"/>
          </circle>
          <text class="op-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">Injection Proof</text>
        </g>
      </g>
    </g>
  </g>
</svg>
