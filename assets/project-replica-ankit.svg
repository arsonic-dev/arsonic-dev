<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="rep-t">
  <title id="rep-t">Replica: Multimodal UI Reconstruction Engine converting designs and screenshots to production code.</title>
  <defs>
    <linearGradient id="rep-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F17"/>
      <stop offset="1" stop-color="#060E0A"/>
    </linearGradient>
    <radialGradient id="rep-glow" cx="80%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1A6B4A" stop-opacity=".6"/>
      <stop offset="1" stop-color="#060E0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rep-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7BC7A4" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="rep-clip"><rect width="1200" height="370" rx="18"/></clipPath>

    <!-- Laser trace gradients for continuous border animations -->
    <linearGradient id="rep-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F8F3"/>
      <stop offset=".45" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rep-card-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5E5CB"/>
      <stop offset=".5" stop-color="#7BC7A4"/>
      <stop offset="1" stop-color="#143D2E" stop-opacity="0"/>
    </linearGradient>

    <!-- Traveling photon gradient -->
    <radialGradient id="rep-photon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </radialGradient>

    <filter id="rep-glow-f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .rep-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .rep-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .rep-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rep-in { animation: rep-fade 1.1s cubic-bezier(.16,1,.3,1) both; }
    .rep-d1 { animation-delay: .1s; } .rep-d2 { animation-delay: .3s; }
    .rep-chip { animation: rep-fade .7s cubic-bezier(.34,1.56,.64,1) both; }
    .rep-draw { stroke-dasharray: 624; stroke-dashoffset: 624; animation: rep-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    @keyframes rep-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rep-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .rep-in, .rep-chip, .rep-draw { animation: none; stroke-dashoffset: 0; } }
  </style>

  <g clip-path="url(#rep-clip)">
    <!-- Background Canvas -->
    <rect width="1200" height="370" fill="url(#rep-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#rep-grid)"/>
    
    <!-- Continuous Ambient Light Glow -->
    <ellipse cx="960" cy="110" rx="360" ry="190" fill="url(#rep-glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -25 15; 0 0" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#7BC7A4" stroke-opacity=".18"/>

    <!-- Continuous Outer Perimeter Laser Trace -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#rep-trace)" stroke-width="1.8" stroke-dasharray="220 2920" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="3140;0" dur="8s" begin="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Left side content -->
    <g class="rep-in rep-d1">
      <text class="rep-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#7BC7A4">03 · MULTIMODAL AI · AGENTIC CODE SYNTHESIS · 2026</text>
      <text class="rep-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F0F8F3">Replica</text>
      <text class="rep-sans" x="56" y="154" font-size="16.5" fill="#8FA99A">Multimodal UI Reconstruction Engine converting screenshots &amp; Figma to production code.</text>
      <text class="rep-mono" x="56" y="188" font-size="12" fill="#B5E5CB"><tspan fill="#7BC7A4">BUILT ›</tspan> Parallel GPT/Claude/Gemini tool loops with WebSocket streaming &amp; auto visual asset cropping</text>
      
      <!-- Divider line -->
      <line class="rep-draw" x1="56" y1="214" x2="680" y2="214" stroke="#7BC7A4" stroke-opacity=".25"/>
      
      <!-- Traveling Photon Packet across divider -->
      <circle cx="56" cy="214" r="3.5" fill="url(#rep-photon-glow)" filter="url(#rep-glow-f)">
        <animate attributeName="cx" values="56;680;56" dur="6s" begin="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1; .45 0 .55 1"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Metrics -->
      <g transform="translate(56, 252)">
        <text class="rep-serif" font-size="32" font-weight="300" fill="#F0F8F3">5</text>
        <text class="rep-sans" y="22" font-size="12" fill="#8FA99A">React, Vue, HTML, etc.</text>
      </g>
      <g transform="translate(210, 252)">
        <text class="rep-serif" font-size="32" font-weight="300" fill="#F0F8F3">3 Agents</text>
        <text class="rep-sans" y="22" font-size="12" fill="#8FA99A">Claude + GPT + Gemini loop</text>
      </g>
      <g transform="translate(425, 252)">
        <text class="rep-serif" font-size="32" font-weight="300" fill="#F0F8F3">Pillow</text>
        <text class="rep-sans" y="22" font-size="12" fill="#8FA99A">Automated asset cropping</text>
      </g>

      <!-- Tech Stack Badges -->
      <g class="rep-chip" style="animation-delay:0.5s">
        <rect x="56" y="306" width="65" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="rep-mono" x="88" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">FastAPI</text>
      </g>
      <g class="rep-chip" style="animation-delay:0.6s">
        <rect x="129" y="306" width="60" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="rep-mono" x="159" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Python</text>
      </g>
      <g class="rep-chip" style="animation-delay:0.7s">
        <rect x="197" y="306" width="70" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="rep-mono" x="232" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Asyncio</text>
      </g>
      <g class="rep-chip" style="animation-delay:0.8s">
        <rect x="275" y="306" width="92" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="rep-mono" x="321" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">WebSockets</text>
      </g>
      <g class="rep-chip" style="animation-delay:0.9s">
        <rect x="375" y="306" width="85" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="rep-mono" x="417" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Multi-LLM</text>
      </g>
      <g class="rep-chip" style="animation-delay:1.0s">
        <rect x="468" y="306" width="135" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="rep-mono" x="535" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Pillow + Pydantic</text>
      </g>
    </g>

    <!-- Right Side Mockup Frame -->
    <g transform="translate(740, 46)">
      <g class="rep-in rep-d2">
        <!-- Browser / Terminal Frame -->
        <rect width="400" height="278" rx="12" fill="#0C241B" stroke="#7BC7A4" stroke-opacity=".3" stroke-width="1.2"/>
        
        <!-- Continuous Laser Border Trace around Frame -->
        <rect width="400" height="278" rx="12" fill="none" stroke="url(#rep-card-trace)" stroke-width="1.6" stroke-dasharray="140 1216" stroke-linecap="round">
          <animate attributeName="stroke-dashoffset" values="1356;0" dur="6s" begin="3s" repeatCount="indefinite"/>
        </rect>

        <!-- Title bar -->
        <rect width="400" height="34" rx="12" fill="#143D2E" fill-opacity=".6"/>
        <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity=".8"/>
        <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity=".8"/>
        <circle cx="52" cy="17" r="4.5" fill="#10B981">
          <animate attributeName="opacity" values="1;.4;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        
        <text class="rep-mono" x="76" y="21" font-size="10.5" fill="#8FA99A">replica.dev/stream</text>
        
        <!-- Live WebSocket Stream Pill -->
        <rect x="250" y="8" width="138" height="18" rx="9" fill="#0B1F17" stroke="#7BC7A4" stroke-opacity=".35"/>
        <circle cx="260" cy="17" r="3" fill="#10B981">
          <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <text class="rep-mono" x="324" y="20.5" text-anchor="middle" font-size="8.5" fill="#B5E5CB">WS STREAM · LIVE</text>

        <!-- Multimodal Reconstruction Box -->
        <g transform="translate(24, 52)">
          <rect width="352" height="110" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          
          <!-- Input Box with subtle pulse -->
          <g transform="translate(16, 16)">
            <rect width="84" height="78" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".3"/>
            <text class="rep-mono" x="42" y="38" text-anchor="middle" font-size="9" fill="#B5E5CB">INPUT</text>
            <text class="rep-mono" x="42" y="52" text-anchor="middle" font-size="8" fill="#8FA99A">PNG / Figma</text>
          </g>
          
          <!-- Connecting Arrow with Traveling Agent Token -->
          <path d="M106 55 H154" stroke="#7BC7A4" stroke-width="1.5" stroke-dasharray="3 3">
            <animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite"/>
          </path>
          
          <!-- Moving Photon Packet between Input and Consensus -->
          <circle cx="106" cy="55" r="3" fill="#10B981" filter="url(#rep-glow-f)">
            <animate attributeName="cx" values="106;154;106" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          </circle>

          <!-- Consensus Box with 3 Agent Status Lights -->
          <g transform="translate(162, 16)">
            <rect width="174" height="78" rx="6" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".3"/>
            
            <!-- 3 Agent Consensus Indicator Lights -->
            <circle cx="14" cy="21" r="2.5" fill="#D97706">
              <animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="22" cy="21" r="2.5" fill="#10B981">
              <animate attributeName="opacity" values="1;.3;1" dur="1.2s" begin=".4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="30" cy="21" r="2.5" fill="#3B82F6">
              <animate attributeName="opacity" values="1;.3;1" dur="1.2s" begin=".8s" repeatCount="indefinite"/>
            </circle>

            <text class="rep-mono" x="38" y="24" font-size="9" fill="#7BC7A4">LLM Consensus</text>
            <text class="rep-mono" x="12" y="42" font-size="8.5" fill="#B5E5CB">✓ React 19 JSX Component</text>
            <text class="rep-mono" x="12" y="58" font-size="8.5" fill="#B5E5CB">✓ Tailwind CSS v4 Layout</text>
            <text class="rep-mono" x="12" y="72" font-size="8" fill="#8FA99A">✓ Cropped: /hero.png</text>
            
            <!-- Blinking typing cursor next to asset -->
            <rect x="116" y="64" width="4" height="9" fill="#10B981">
              <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>

        <!-- Status Cards -->
        <g transform="translate(24, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="rep-mono" x="14" y="22" font-size="10" fill="#8FA99A">AGENT LOOP</text>
          <text class="rep-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">Self-Correcting</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <text class="rep-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">Tool-Calling Loops</text>
        </g>
        
        <g transform="translate(206, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="rep-mono" x="14" y="22" font-size="10" fill="#8FA99A">STREAM PROTOCOL</text>
          <text class="rep-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">WebSocket Live</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" begin=".75s" repeatCount="indefinite"/>
          </circle>
          <text class="rep-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">Zero-Latency Token</text>
        </g>
      </g>
    </g>
  </g>
</svg>
