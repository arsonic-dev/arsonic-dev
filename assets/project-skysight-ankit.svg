<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="sky-t">
  <title id="sky-t">SkySight: UAV Operations Platform decoding MAVLink telemetry with post-flight diagnostics.</title>
  <defs>
    <linearGradient id="sky-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F17"/>
      <stop offset="1" stop-color="#060E0A"/>
    </linearGradient>
    <radialGradient id="sky-glow" cx="80%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1A6B4A" stop-opacity=".6"/>
      <stop offset="1" stop-color="#060E0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sky-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7BC7A4" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="sky-clip"><rect width="1200" height="370" rx="18"/></clipPath>

    <!-- Laser trace gradients for continuous border animations -->
    <linearGradient id="sky-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F8F3"/>
      <stop offset=".45" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky-card-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5E5CB"/>
      <stop offset=".5" stop-color="#7BC7A4"/>
      <stop offset="1" stop-color="#143D2E" stop-opacity="0"/>
    </linearGradient>

    <!-- Radar beam gradient -->
    <linearGradient id="sky-radar-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5E5CB" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </linearGradient>

    <!-- Traveling photon gradient -->
    <radialGradient id="sky-photon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#B5E5CB"/>
      <stop offset="1" stop-color="#7BC7A4" stop-opacity="0"/>
    </radialGradient>

    <filter id="sky-glow-f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sky-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .sky-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sky-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sky-in { animation: sky-fade 1.1s cubic-bezier(.16,1,.3,1) both; }
    .sky-d1 { animation-delay: .1s; } .sky-d2 { animation-delay: .3s; }
    .sky-chip { animation: sky-fade .7s cubic-bezier(.34,1.56,.64,1) both; }
    .sky-draw { stroke-dasharray: 624; stroke-dashoffset: 624; animation: sky-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    @keyframes sky-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sky-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .sky-in, .sky-chip, .sky-draw { animation: none; stroke-dashoffset: 0; } }
  </style>

  <g clip-path="url(#sky-clip)">
    <!-- Background Canvas -->
    <rect width="1200" height="370" fill="url(#sky-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#sky-grid)"/>
    
    <!-- Continuous Ambient Light Glow -->
    <ellipse cx="960" cy="110" rx="360" ry="190" fill="url(#sky-glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -25 15; 0 0" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#7BC7A4" stroke-opacity=".18"/>

    <!-- Continuous Outer Perimeter Laser Trace -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#sky-trace)" stroke-width="1.8" stroke-dasharray="220 2920" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="3140;0" dur="8s" begin="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Left side content -->
    <g class="sky-in sky-d1">
      <text class="sky-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#7BC7A4">04 · IOT &amp; ROBOTICS · REALTIME TELEMETRY · 2026</text>
      <text class="sky-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F0F8F3">SkySight</text>
      <text class="sky-sans" x="56" y="154" font-size="16.5" fill="#8FA99A">UAV Operations Platform decoding MAVLink PX4 telemetry with 3D flight intelligence.</text>
      <text class="sky-mono" x="56" y="188" font-size="12" fill="#B5E5CB"><tspan fill="#7BC7A4">BUILT ›</tspan> Real-time pymavlink + Redis Pub/Sub pipeline with Python anomaly diagnostics</text>
      
      <!-- Divider line -->
      <line class="sky-draw" x1="56" y1="214" x2="680" y2="214" stroke="#7BC7A4" stroke-opacity=".25"/>
      
      <!-- Traveling Photon Packet across divider -->
      <circle cx="56" cy="214" r="3.5" fill="url(#sky-photon-glow)" filter="url(#sky-glow-f)">
        <animate attributeName="cx" values="56;680;56" dur="6s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1; .45 0 .55 1"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Metrics -->
      <g transform="translate(56, 252)">
        <text class="sky-serif" font-size="32" font-weight="300" fill="#F0F8F3">10 Types</text>
        <text class="sky-sans" y="22" font-size="12" fill="#8FA99A">MAVLink telemetry msgs</text>
      </g>
      <g transform="translate(230, 252)">
        <text class="sky-serif" font-size="32" font-weight="300" fill="#F0F8F3">4 Classes</text>
        <text class="sky-sans" y="22" font-size="12" fill="#8FA99A">battery/GPS/motor anomalies</text>
      </g>
      <g transform="translate(425, 252)">
        <text class="sky-serif" font-size="32" font-weight="300" fill="#F0F8F3">Live Stream</text>
        <text class="sky-sans" y="22" font-size="12" fill="#8FA99A">Redis + FastAPI WebSocket</text>
      </g>

      <!-- Tech Stack Badges -->
      <g class="sky-chip" style="animation-delay:0.5s">
        <rect x="56" y="306" width="65" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="sky-mono" x="88" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">FastAPI</text>
      </g>
      <g class="sky-chip" style="animation-delay:0.6s">
        <rect x="129" y="306" width="76" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="sky-mono" x="167" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">MAVLink</text>
      </g>
      <g class="sky-chip" style="animation-delay:0.7s">
        <rect x="213" y="306" width="56" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="sky-mono" x="241" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Redis</text>
      </g>
      <g class="sky-chip" style="animation-delay:0.8s">
        <rect x="277" y="306" width="60" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="sky-mono" x="307" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Celery</text>
      </g>
      <g class="sky-chip" style="animation-delay:0.9s">
        <rect x="345" y="306" width="70" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="sky-mono" x="380" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Next.js</text>
      </g>
      <g class="sky-chip" style="animation-delay:1.0s">
        <rect x="423" y="306" width="72" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="sky-mono" x="459" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">Three.js</text>
      </g>
      <g class="sky-chip" style="animation-delay:1.1s">
        <rect x="503" y="306" width="88" height="26" rx="13" fill="#143D2E" stroke="#7BC7A4" stroke-opacity=".35"/>
        <text class="sky-mono" x="547" y="323" text-anchor="middle" font-size="11" fill="#B5E5CB">PostgreSQL</text>
      </g>
    </g>

    <!-- Right Side Mockup Frame -->
    <g transform="translate(740, 46)">
      <g class="sky-in sky-d2">
        <!-- Browser / Terminal Frame -->
        <rect width="400" height="278" rx="12" fill="#0C241B" stroke="#7BC7A4" stroke-opacity=".3" stroke-width="1.2"/>
        
        <!-- Continuous Laser Border Trace around Frame -->
        <rect width="400" height="278" rx="12" fill="none" stroke="url(#sky-card-trace)" stroke-width="1.6" stroke-dasharray="140 1216" stroke-linecap="round">
          <animate attributeName="stroke-dashoffset" values="1356;0" dur="6s" begin="4.5s" repeatCount="indefinite"/>
        </rect>

        <!-- Title bar -->
        <rect width="400" height="34" rx="12" fill="#143D2E" fill-opacity=".6"/>
        <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity=".8"/>
        <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity=".8"/>
        <circle cx="52" cy="17" r="4.5" fill="#10B981">
          <animate attributeName="opacity" values="1;.4;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        
        <text class="sky-mono" x="76" y="21" font-size="10.5" fill="#8FA99A">skysight.ops/gcs</text>
        
        <!-- Live Telemetry Stream Pill -->
        <rect x="246" y="8" width="142" height="18" rx="9" fill="#0B1F17" stroke="#7BC7A4" stroke-opacity=".35"/>
        <circle cx="256" cy="17" r="3" fill="#10B981">
          <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <text class="sky-mono" x="322" y="20.5" text-anchor="middle" font-size="8.5" fill="#B5E5CB">MAVLINK · 100Hz</text>

        <!-- 3D Drone & Telemetry Box -->
        <g transform="translate(24, 52)">
          <rect width="352" height="110" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          
          <!-- Radar Grid Rings -->
          <circle cx="60" cy="55" r="40" fill="none" stroke="#7BC7A4" stroke-opacity=".2"/>
          <circle cx="60" cy="55" r="24" fill="none" stroke="#7BC7A4" stroke-opacity=".3"/>
          
          <!-- Radar Expanding Ping Wave -->
          <circle cx="60" cy="55" r="8" fill="none" stroke="#7BC7A4">
            <animate attributeName="r" values="8;38" dur="2.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/>
          </circle>

          <!-- Rotating 360-degree Radar Sweeping Beam -->
          <line x1="60" y1="55" x2="98" y2="55" stroke="url(#sky-radar-beam)" stroke-width="1.8" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" from="0 60 55" to="360 60 55" dur="3s" repeatCount="indefinite"/>
          </line>

          <line x1="20" y1="55" x2="100" y2="55" stroke="#7BC7A4" stroke-opacity=".2"/>
          <line x1="60" y1="15" x2="60" y2="95" stroke="#7BC7A4" stroke-opacity=".2"/>
          
          <!-- Drone Icon with Hover Micro-motion -->
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
            <polygon points="60,45 68,62 60,58 52,62" fill="#7BC7A4"/>
          </g>
          
          <text class="sky-mono" x="60" y="78" text-anchor="middle" font-size="8" fill="#B5E5CB">UAV-01</text>

          <!-- Live Telemetry Readout -->
          <g transform="translate(130, 20)">
            <text class="sky-mono" font-size="9.5" fill="#7BC7A4">PX4 AUTOPILOT STATUS</text>
            <text class="sky-mono" y="18" font-size="9" fill="#F0F8F3">ALT: 124.8m | SPEED: 14.2 m/s</text>
            <text class="sky-mono" y="34" font-size="9" fill="#B5E5CB">BATT: 94% (24.2V) | GPS: 18 SAT</text>
            
            <!-- Live ECG Heartbeat blip -->
            <circle cx="0" cy="47" r="2.5" fill="#10B981">
              <animate attributeName="opacity" values="1;.2;1" dur="0.9s" repeatCount="indefinite"/>
            </circle>
            <text class="sky-mono" x="8" y="50" font-size="9" fill="#8FA99A">MAV_HEARTBEAT · NORMAL</text>
          </g>
        </g>

        <!-- Status Cards -->
        <g transform="translate(24, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="sky-mono" x="14" y="22" font-size="10" fill="#8FA99A">POST-FLIGHT ENGINE</text>
          <text class="sky-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">0 Anomalies</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <text class="sky-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">Motor &amp; GPS Stable</text>
        </g>
        
        <g transform="translate(206, 178)">
          <rect width="170" height="74" rx="8" fill="#06120D" stroke="#7BC7A4" stroke-opacity=".15"/>
          <text class="sky-mono" x="14" y="22" font-size="10" fill="#8FA99A">PUB/SUB CHANNEL</text>
          <text class="sky-sans" x="14" y="42" font-size="13" font-weight="600" fill="#F0F8F3">FastAPI + Redis</text>
          <circle cx="18" cy="57" r="2.5" fill="#10B981">
            <animate attributeName="opacity" values="1;.3;1" dur="1.5s" begin=".75s" repeatCount="indefinite"/>
          </circle>
          <text class="sky-mono" x="26" y="60" font-size="10.5" fill="#7BC7A4">10ms Telemetry Frame</text>
        </g>
      </g>
    </g>
  </g>
</svg>
